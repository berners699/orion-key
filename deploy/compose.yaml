name: ${COMPOSE_PROJECT_NAME:-orion-cloud}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    platform: linux/amd64
    pull_policy: never
    environment:
      POSTGRES_DB: orionkey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?请配置数据库管理密码}
      ORION_DB_PASSWORD: ${DB_PASSWORD:?请配置应用数据库密码}
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-orion.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orionkey"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging
    networks: [app]

  api:
    image: ${API_IMAGE:-orion-key-api:cloud}
    platform: linux/amd64
    pull_policy: never
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:postgresql://postgres:5432/orionkey
      DB_USERNAME: orion
      DB_PASSWORD: ${DB_PASSWORD:?请配置应用数据库密码}
      JWT_SECRET: ${JWT_SECRET:?请配置JWT密钥}
      PASSWORD_PLAIN: "false"
      UPLOAD_PATH: /app/uploads
      MAIL_ENABLED: "false"
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: "465"
      MAIL_USERNAME: noreply@localhost
      MAIL_PASSWORD: ""
      MAIL_SITE_URL: ${SITE_URL:-http://177.2.18.123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      RATE_LIMIT_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.30.18.1}
      LOGGING_LEVEL_COM_ORIONKEY: INFO
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -Xss512k"
    ports:
      - "127.0.0.1:${API_PORT:-8083}:8083"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 3s
      retries: 24
      start_period: 60s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
    networks: [app]

  web:
    image: ${WEB_IMAGE:-orion-key-web:cloud}
    platform: linux/amd64
    pull_policy: never
    environment:
      TZ: Asia/Shanghai
      BACKEND_URL: http://api:8083
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging
    networks: [app]

  bepusdt:
    image: ${BEPUSDT_IMAGE:-orion-key-bepusdt:cloud}
    platform: linux/amd64
    pull_policy: never
    environment:
      TZ: Asia/Shanghai
      LISTEN: ":8080"
      LOG: /var/lib/bepusdt/logs
      SQLITE: /var/lib/bepusdt/sqlite.db
    ports:
      - "127.0.0.1:${BEPUSDT_PORT:-8881}:8080"
    volumes:
      - bepusdt_data:/var/lib/bepusdt
    mem_limit: 192m
    restart: unless-stopped
    logging: *logging
    networks: [app]

networks:
  app:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.18.0/24}
          gateway: ${DOCKER_GATEWAY:-172.30.18.1}

volumes:
  postgres_data:
  uploads:
  bepusdt_data:
